<title>BSU Student Printing Ops Product Documentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a printed university handbook. One reading column (~68ch) with a wide lane for
   plates (diagrams, tables, screenshots); chapters open on a crimson rule; the cover is a full sheet. */
:root {
  --crimson: #8b1e24;          /* BSU crimson, the app's brand color */
  --crimson-deep: #5f1218;
  --stone: #f5f1ea;            /* page ground: warm campus stone */
  --paper: #fffdf9;            /* plates and cards */
  --ink: #1f1a17;
  --ink-2: #4a423d;
  --muted: #5f5751;  --pattern: rgba(139, 30, 36, .055);
  --rule: #e2d9cf;
  --gold: #b8892b;             /* used sparingly: tabs and pips */
  --green: #2f7d4f; --amber: #b7791f; --red: #b42323; --grey: #8d8580;
  --display: "Libre Franklin", "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
  --body: "Source Serif 4", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --measure: 68ch;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --crimson: #e0636b; --crimson-deep: #f19aa0; --stone: #17120f; --paper: #211b18; --ink: #f2ece6;
    --ink-2: #d4cbc4; --muted: #ada39b; --pattern: rgba(255, 255, 255, .045); --rule: #3a312c; --gold: #d9ac52;
    --green: #5cc58a; --amber: #e2a94a; --red: #ff7c7c; --grey: #a49b95; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --crimson: #e0636b; --crimson-deep: #f19aa0; --stone: #17120f; --paper: #211b18; --ink: #f2ece6;
  --ink-2: #d4cbc4; --muted: #ada39b; --pattern: rgba(255, 255, 255, .045); --rule: #3a312c; --gold: #d9ac52;
  --green: #5cc58a; --amber: #e2a94a; --red: #ff7c7c; --grey: #a49b95; color-scheme: dark;
}
* { box-sizing: border-box; }
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: var(--pattern);
  -webkit-mask: url("{{PATTERN_URI}}") 0 0 / 720px 720px repeat; mask: url("{{PATTERN_URI}}") 0 0 / 720px 720px repeat; }
.doc { position: relative; z-index: 1; }
@media (prefers-contrast: more), (forced-colors: active) { body::before, .cover::before { display: none; } }
body { background: var(--stone); color: var(--ink); font: 17px/1.62 var(--body); margin: 0;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.doc { max-width: 1060px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 48px); padding-block: 0 72px; }
h1, h2, h3, h4, .display { font-family: var(--display); color: var(--ink); text-wrap: balance; line-height: 1.15; }
h2 { font-size: clamp(30px, 4vw, 42px); font-weight: 800; letter-spacing: -0.015em; margin: 0 0 6px; }
h3 { font-size: 23px; font-weight: 750; margin: 46px 0 8px; letter-spacing: -0.005em; }
h4 { font-size: 15px; font-weight: 750; margin: 28px 0 6px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--crimson); }
p, ul, ol, dl { max-width: var(--measure); }
p { margin: 0 0 14px; }
ul, ol { padding-left: 1.3em; margin: 0 0 14px; }
li { margin: 3px 0; }
a { color: var(--crimson); text-underline-offset: 2px; }
a:focus-visible, summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
strong { font-weight: 600; }
code, .mono { font-family: var(--mono); font-size: .86em; }
code { background: color-mix(in srgb, var(--crimson) 7%, transparent); padding: 1px 5px; border-radius: 4px; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 36px 0; }

/* ---------- cover ---------- */
.cover { min-height: 0; background: var(--crimson-deep); color: #fff; margin: 0 calc(-1 * clamp(16px, 4vw, 48px));
  padding: clamp(36px, 6vw, 72px) clamp(20px, 6vw, 72px) 40px; position: relative; overflow: hidden; }
:root .cover { background: linear-gradient(160deg, #6b141b 0%, #8b1e24 58%, #a3262d 100%); }
.cover__top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  font: 600 12px/1.4 var(--display); letter-spacing: .14em; text-transform: uppercase; color: #f3d9b0; }
.seal { width: 84px; height: 98px; flex: none; display: block; }
.seal svg, .cover__art svg { width: 100%; height: 100%; display: block; }
.cover::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: rgba(255, 255, 255, .085);
  -webkit-mask: url("{{PATTERN_URI}}") 0 0 / 620px 620px repeat; mask: url("{{PATTERN_URI}}") 0 0 / 620px 620px repeat; }
.cover > * { position: relative; }
.cover__art { margin: 26px 0 10px; max-width: 900px; opacity: .95; }
.cover h1 { color: #fff; font-size: clamp(48px, 9vw, 104px); font-weight: 900; letter-spacing: -0.035em;
  line-height: .92; margin: 56px 0 18px; }
.cover h1 span { display: block; font-weight: 400; font-style: italic; font-family: var(--body);
  font-size: .36em; letter-spacing: 0; margin-top: 14px; color: #f6e7d2; line-height: 1.2; }
.cover__lede { font-size: 19px; max-width: 46ch; color: #fbeee0; margin-bottom: 34px; }
.pips { display: flex; flex-wrap: wrap; gap: 6px; max-width: 640px; margin: 8px 0 6px; }
.pip { width: 16px; height: 16px; border-radius: 3px; background: #63c08a; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.pip--labs { background: #e8c46a; } .pip--sat { background: #f1f1f1; }
.pips__key { font: 500 12px/1.5 var(--mono); color: #f6dcc0; }
.cover__meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px 24px;
  margin-top: 40px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.28); max-width: 820px; }
.cover__meta dt { font: 600 11px/1.3 var(--display); text-transform: uppercase; letter-spacing: .12em; color: #f3d9b0; }
.cover__meta dd { margin: 3px 0 0; font: 600 16px/1.35 var(--display); color: #fff; }
.cover__credit { margin-top: 34px; font-size: 15px; color: #fbeee0; max-width: 60ch; }
.cover__credit b { font-family: var(--display); font-weight: 750; color: #fff; }
.cover__note { margin-top: 22px; font: 12.5px/1.5 var(--display); color: #f0c9b0; max-width: 72ch; }

/* ---------- chapter furniture ---------- */
.chapter { padding-top: 64px; }
.chapter__eyebrow { display: flex; align-items: baseline; gap: 12px; font: 700 13px/1 var(--display);
  letter-spacing: .14em; text-transform: uppercase; color: var(--crimson); border-top: 4px solid var(--crimson);
  padding-top: 14px; margin-bottom: 14px; }
.chapter__eyebrow .phase { color: var(--muted); letter-spacing: .1em; }
.chapter__lede { font-size: 20px; line-height: 1.5; color: var(--ink-2); max-width: 60ch; margin-bottom: 22px; }
.audiences { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 22px; }
.aud { font: 600 11.5px/1 var(--display); letter-spacing: .04em; padding: 6px 9px; border-radius: 99px;
  border: 1px solid var(--rule); color: var(--ink-2); background: var(--paper); }
.aud--on { border-color: var(--crimson); color: var(--crimson); }

/* "In short" and audience boxes */
.inshort { background: var(--paper); border: 1px solid var(--rule); border-left: 5px solid var(--crimson);
  padding: 16px 20px; margin: 18px 0 24px; max-width: 760px; border-radius: 0 10px 10px 0; }
.inshort b.lbl, .extra b.lbl { display: block; font: 800 11.5px/1 var(--display); letter-spacing: .14em;
  text-transform: uppercase; color: var(--crimson); margin-bottom: 8px; }
.inshort p:last-child, .extra p:last-child { margin-bottom: 0; }
.extras { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 22px 0 8px; }
.extra { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; font-size: 15.5px; min-width: 0; }
.extra b.lbl { color: var(--ink-2); }

/* plates: diagrams, charts and screenshots sit on paper in both themes */
.plate { background: #fffdf9; border: 1px solid #e2d9cf; border-radius: 12px; padding: 18px 18px 12px;
  margin: 22px 0 26px; overflow-x: auto; color: #1f1a17; }
.plate figcaption, figure.plate figcaption { font: 13.5px/1.5 var(--display); color: #5b524c; margin-top: 10px; max-width: 80ch; }
.plate figcaption b { color: #8b1e24; font-weight: 750; }
.plate pre.mermaid { margin: 0; background: transparent; text-align: center; font-size: 14px; }
.plate img { display: block; max-width: 100%; height: auto; border-radius: 6px; border: 1px solid #e2d9cf; margin: 0 auto; }
.plate svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.shots figure { margin: 0; min-width: 0; }

/* tables */
.tbl { overflow-x: auto; margin: 16px 0 24px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); }
table { border-collapse: collapse; width: 100%; font: 14px/1.45 var(--display); }
th { text-align: left; font-weight: 750; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-2); background: color-mix(in srgb, var(--crimson) 6%, var(--paper)); padding: 9px 12px;
  border-bottom: 2px solid var(--crimson); white-space: nowrap; }
td { padding: 8px 12px; border-top: 1px solid var(--rule); vertical-align: top; }
td code { white-space: nowrap; }
.nw { white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
.tag { display: inline-block; font: 700 11px/1 var(--display); letter-spacing: .05em; padding: 4px 7px;
  border-radius: 5px; white-space: nowrap; }
.tag--must { background: color-mix(in srgb, var(--crimson) 14%, transparent); color: var(--crimson); }
.tag--should { background: color-mix(in srgb, var(--gold) 20%, transparent); color: var(--ink-2); }
.tag--could { background: color-mix(in srgb, var(--grey) 18%, transparent); color: var(--ink-2); }
.tag--ok { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.tag--part { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }
.tag--gap { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
.hit { font: 700 12px/1 var(--mono); color: var(--crimson); }
caption { caption-side: top; text-align: left; padding: 10px 12px 2px; font: 700 13.5px/1.4 var(--display); color: var(--ink); }

/* contents, reading paths */
.toc { columns: 2 280px; column-gap: 40px; margin: 10px 0 0; padding: 0; list-style: none; max-width: none; }
.toc li { break-inside: avoid; margin: 0 0 10px; }
.toc a { text-decoration: none; color: var(--ink); font: 650 16px/1.35 var(--display); }
.toc a:hover { color: var(--crimson); }
.toc small { display: block; font: 13.5px/1.4 var(--body); color: var(--muted); }
.toc .n { font: 700 12px/1 var(--mono); color: var(--crimson); margin-right: 8px; }
.paths { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 16px 0; }
.path { background: var(--paper); border: 1px solid var(--rule); border-top: 4px solid var(--crimson);
  border-radius: 8px; padding: 14px; min-width: 0; font-size: 15px; }
.path h4 { margin: 0 0 6px; color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 17px; }
.path p { margin: 0; }

dl.defs { display: grid; grid-template-columns: minmax(130px, 220px) 1fr; gap: 6px 18px; max-width: 900px; }
dl.defs dt { font: 700 14.5px/1.4 var(--display); }
dl.defs dd { margin: 0; }
.steps { counter-reset: s; list-style: none; padding: 0; }
.steps > li { counter-increment: s; position: relative; padding-left: 40px; margin: 0 0 12px; }
.steps > li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 26px; height: 26px;
  border-radius: 50%; background: var(--crimson); color: #fff; font: 700 13px/26px var(--display); text-align: center; }
.callout { font: 14px/1.5 var(--display); color: var(--ink-2); border: 1px dashed var(--rule); border-radius: 8px;
  padding: 10px 14px; max-width: 760px; margin: 12px 0 20px; background: var(--paper); }
.foot { margin-top: 64px; padding-top: 20px; border-top: 4px solid var(--crimson); font: 14px/1.6 var(--display); color: var(--muted); }
.foot b { color: var(--ink); }

@media (max-width: 640px) {
  body { font-size: 16px; }
  dl.defs { grid-template-columns: 1fr; }
  dl.defs dd { margin-bottom: 8px; }
  .chapter__lede { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
@media print {
  @page { size: letter; margin: 0.6in 0.6in 0.7in; }
  body { background: #fff; font-size: 11pt; }
  .doc { max-width: none; padding: 0; }
  @page :first { margin: 0; }
  .cover { margin: 0 !important; height: 11in; overflow: hidden; padding: 0.8in 0.75in 0.6in; page-break-after: always; break-after: page; }
  .cover h1 { font-size: 66px; margin: 26px 0 12px; }
  .cover > div[style] { margin-top: 18px !important; }
  .cover__lede { font-size: 15px; margin-bottom: 18px; }
  .cover__meta { margin-top: 22px; padding-top: 14px; }
  .cover__credit { margin-top: 18px; font-size: 13px; }
  .cover__note { margin-top: 12px; font-size: 10.5px; }
  .seal { width: 64px; height: 74px; }
  .cover__art { margin: 6px 0 2px; max-width: 4.6in; }
  .cover h1 { font-size: 58px; margin: 18px 0 10px; }
  .cover h1 span { font-size: .34em; margin-top: 8px; }
  .pip { width: 11px; height: 11px; border-radius: 2px; }
  .pips { gap: 4px; margin: 4px 0 2px; }
  .pips__key { font-size: 9.5px; }
  .cover__meta { grid-template-columns: repeat(4, 1fr); gap: 8px 14px; margin-top: 14px; }
  .cover__meta dd { font-size: 12.5px; }
  body::before { display: none; }
  .plate svg { max-height: 8.2in; width: auto; }
  h2, h3, h4, caption { break-after: avoid; page-break-after: avoid; }
  #control { padding-top: 0 !important; }
  .chapter { break-before: page; padding-top: 0; }
  .plate, .tbl, .extra, .path, .inshort, figure { break-inside: avoid; }
  a { color: inherit; text-decoration: none; }
}
</style>
