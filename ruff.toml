# Lint rules checked in CI (see .github/workflows/ci.yml).
target-version = "py311"
line-length = 120
extend-exclude = ["legacy", "data"]

[lint]
select = ["E", "F", "W", "B"]
ignore = [
  "E501",  # long lines: the formatter's limit is a guide, not a rule, for tables and prose strings
  "E731",  # small lambdas for column maps read better inline
  "E741",  # `l` for a level column is clear in context
  "B905",  # zip(strict=...) adds noise where lengths are equal by construction
  "B023",  # closures here run immediately inside their own loop iteration
]
