name: Deploy to Azure

# Optional: deploys a pushed commit on master to Azure Container Apps after the tests pass, using
# OpenID Connect (no stored Azure password). Turn it on by setting the repository variable
# AZURE_DEPLOY=true and the secrets AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID
# (see docs/SECURITY.md, "Updates"). Without them it does nothing; deploy.sh from your Mac still works.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before deploying
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pytest -q
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy (rolling; the site stays up)
        run: ./deploy/azure-containerapps/deploy.sh
